<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DocSigGuard - Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <h2>Register Akun</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="text" name="username" placeholder="Username Baru" required autocomplete="off">
            <input type="email" name="email" placeholder="Alamat Email Akurat" required autocomplete="off">
            <input type="password" name="password" placeholder="Password Baru" required>
            <button type="submit" style="background: #2ecc71;">Buat Akun & Kirim Kode</button>
        </form>
        <p style="font-size: 12px; color: #555; margin-top: 15px;">Sudah terdaftar? <a href="/login" style="font-weight:bold;">Login ke Akun</a></p>
    </div>
</body>
</html>
