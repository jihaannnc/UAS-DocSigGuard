<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>DocSigGuard - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="box">
        <h2>Login Sistem</h2>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="post">
            <input type="text" name="username_or_email" placeholder="Username atau Email" required autocomplete="off">
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p style="font-size: 12px; color: #555; margin-top: 15px;">Belum memiliki akses? <a href="/register" style="font-weight:bold;">Register Akun Baru</a></p>
    </div>
</body>
</html>
